name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade "cython<3.0" buildozer

      - name: Create spec file
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = سيد المحيطات رياضة أولى ثانوي
          package.name = sayedmath
          package.domain = org.sayed
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0.0
          requirements = python3,kivy,requests,urllib3,charset_normalizer,idna,certifi
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license = True
          p4a.branch = master
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sayed-Math-APK
          path: bin/*.apk
          
